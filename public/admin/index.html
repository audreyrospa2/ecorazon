<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Ecorazón CMS</title>
<style>
  :root {
    --forest-green: #2C5F2D;
    --deep-olive: #4A5D23;
    --cork-brown: #8B7355;
    --warm-beige: #F5F0E8;
    --border: #E0DAD0;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--warm-beige);
    color: #2b2b2b;
  }
  header {
    background: var(--forest-green);
    color: white;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header .meta { font-size: 0.8rem; opacity: 0.85; }
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 90vh;
    text-align: center;
  }
  #login-screen button, .btn {
    background: var(--forest-green);
    color: white;
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn.secondary { background: var(--cork-brown); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  nav.tabs {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem 0;
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    color: #555;
  }
  nav.tabs button.active {
    color: var(--forest-green);
    border-bottom-color: var(--forest-green);
    font-weight: 600;
  }
  main { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
  .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .title { font-weight: 600; }
  .list-row .sub { font-size: 0.8rem; color: #777; }
  .row-actions button { margin-left: 0.4rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 1rem 0 0.3rem; color: #444; }
  input[type=text], input[type=datetime-local], textarea, select {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  textarea { min-height: 220px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
  .checkbox-row input { width: auto; }
  .tag-options { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
  .tag-options label {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-weight: 400; font-size: 0.8rem;
    background: var(--warm-beige); padding: 0.3rem 0.6rem; border-radius: 20px;
    margin: 0; cursor: pointer;
  }
  .tag-options input { width: auto; }
  .form-actions { margin-top: 1.5rem; display: flex; gap: 0.6rem; }
  #status-msg { font-size: 0.85rem; margin-top: 0.8rem; }
  #status-msg.error { color: var(--danger); }
  #status-msg.success { color: var(--forest-green); }
  .top-actions { display: flex; justify-content: space-between; margin-bottom: 1rem; }
  .empty-note { color: #888; font-size: 0.85rem; }
  .image-preview { max-width: 200px; border-radius: 6px; margin-top: 0.4rem; display: block; }
</style>
</head>
<body>

<script>
  const CONFIG = {
    OWNER: "audreyrospa2",
    REPO: "ecorazon",
    BRANCH: "main",
    WORKER_URL: "https://ecorazon-cms-oauth.audreyrospa2.workers.dev",
    BLOG_CONTENT_PATH: "src/content/blog",
    BLOG_IMAGE_PATH: "public/images/blog",
    BLOG_PUBLIC_IMAGE_PREFIX: "/images/blog",
    PRODUCTS_PATH: "src/data/products.json",
    PRODUCT_TAXONOMY_PATH: "src/data/product-taxonomy.json",

</script>

<div id="login-screen">
  <h2>Ecorazón CMS</h2>
  <p>Log in with GitHub to edit site content.</p>
  <button id="login-btn">Login with GitHub</button>
  <p id="login-error" style="color:#b3261e;font-size:0.85rem;"></p>

  <div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid #E0DAD0;width:260px;">
    <p style="font-size:0.85rem;color:#777;margin-bottom:0.6rem;">Client access</p>
    <input type="password" id="client-password-input" placeholder="Password" style="width:100%;padding:0.55rem 0.7rem;border:1px solid #E0DAD0;border-radius:6px;font-size:0.9rem;margin-bottom:0.6rem;" />
    <button id="client-login-btn" style="width:100%;background:#8B7355;color:white;border:none;padding:0.6rem;border-radius:6px;cursor:pointer;">Client Login</button>
    <p id="client-login-error" style="color:#b3261e;font-size:0.85rem;margin-top:0.5rem;"></p>
  </div>
</div>

          <img id="f-image-preview" class="image-preview" style="display:none;" />

        <div id="c-steps-list"></div>
        <button class="btn secondary" id="c-steps-add" style="margin-top:0.8rem;">+ Add step</button>

<script>
(function () {
  const ALL_TAGS = ["Sustainability","Artists","Corporate Gifting","ESG","Upcycling","Seed Paper","Social Impact","Innovation"];
  let token = sessionStorage.getItem("ecorazon_gh_token") || null;
  let currentFile = null; // { path, sha } of post being edited

  // ---------- Auth ----------
  document.getElementById("login-btn").onclick = () => {
    const popup = window.open(`${CONFIG.WORKER_URL}/auth`, "gh-oauth", "width=600,height=700");
    window.addEventListener("message", function handler(e) {
      if (e.data && e.data.type === "ecorazon-cms-auth") {
        token = e.data.token;
        sessionStorage.setItem("ecorazon_gh_token", token);
        window.removeEventListener("message", handler);
        boot();
      }
    });
  };

  document.getElementById("logout-btn").onclick = (e) => {
    e.preventDefault();
    sessionStorage.removeItem("ecorazon_gh_token");
    location.reload();
  };

  document.getElementById("client-login-btn").onclick = async () => {
    const pwInput = document.getElementById("client-password-input");
    const errEl = document.getElementById("client-login-error");
    errEl.textContent = "";
    const password = pwInput.value;
    if (!password) return;
    try {
      const res = await fetch(`${CONFIG.WORKER_URL}/password-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || "Login failed.";
        return;
      }
      token = data.token;
      sessionStorage.setItem("ecorazon_gh_token", token);
      boot();
    } catch (err) {
      errEl.textContent = "Could not reach the login service.";
    }
  };

  document.getElementById("client-password-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("client-login-btn").click();
  });

  async function ghFetch(path, options = {}) {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/${path}`, {
      ...options,
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      sessionStorage.removeItem("ecorazon_gh_token");
      document.getElementById("login-error").textContent = "Session expired — please log in again.";
      document.getElementById("app").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
      throw new Error("Unauthorized");
    }
    return res;
  }

  async function boot() {
    if (!token) return;
    try {
      const meRes = await fetch("https://api.github.com/user", {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!meRes.ok) throw new Error("bad token");
      const me = await meRes.json();
      document.getElementById("user-label").textContent = me.login;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadBlogList();
    } catch (err) {
      sessionStorage.removeItem("ecorazon_gh_token");
      document.getElementById("login-error").textContent = "Login failed — please try again.";
    }
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach((p) => (p.style.display = "none"));
      document.getElementById(`tab-${btn.dataset.tab}`).style.display = "block";
    };
  });

  // ---------- Blog: list ----------
  async function loadBlogList() {
    const listEl = document.getElementById("blog-list");
    listEl.innerHTML = "<p class='empty-note'>Loading…</p>";
    try {
      const res = await ghFetch(`contents/${CONFIG.BLOG_CONTENT_PATH}?ref=${CONFIG.BRANCH}`);
      if (res.status === 404) {
        listEl.innerHTML = "<p class='empty-note'>No posts folder found yet.</p>";
        return;
      }
      const files = (await res.json()).filter((f) => f.name.endsWith(".md"));
      if (!files.length) {
        listEl.innerHTML = "<p class='empty-note'>No posts yet — create one!</p>";
        return;
      }
      listEl.innerHTML = "";
      files.sort((a, b) => b.name.localeCompare(a.name));
      files.forEach((f) => {
        const row = document.createElement("div");
        row.className = "list-row";
        row.innerHTML = `
          <div>
            <div class="title">${f.name.replace(/\.md$/, "")}</div>
            <div class="sub">${f.path}</div>
          </div>
          <div class="row-actions">
            <button class="btn secondary edit-btn">Edit</button>
          </div>`;
        row.querySelector(".edit-btn").onclick = () => openPost(f.path);
        listEl.appendChild(row);
      });
    } catch (err) {
      if (err.message !== "Unauthorized") {
        listEl.innerHTML = `<p class='empty-note'>Error loading posts: ${err.message}</p>`;
      }
    }
  }

  document.getElementById("new-post-btn").onclick = () => openPost(null);
  document.getElementById("back-to-list-btn").onclick = () => {
    document.getElementById("blog-edit-view").style.display = "none";
    document.getElementById("blog-list-view").style.display = "block";
    loadBlogList();
  };

  // ---------- Blog: frontmatter parse/serialize (matches this project's exact schema) ----------
  function parsePost(raw) {
    const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!match) return { title: "", date: "", image: "", imageAlt: "", category: "Impact", tags: [], excerpt: "", draft: true, body: raw };
    const fmText = match[1];
    const body = match[2] || "";
    const data = { tags: [] };
    const lines = fmText.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const kv = line.match(/^(\w+):\s?(.*)$/);
      if (kv) {
        const key = kv[1];
        let val = kv[2].trim();
        if (val === "" && lines[i + 1] && /^\s*-\s/.test(lines[i + 1])) {
          const arr = [];
          i++;
          while (i < lines.length && /^\s*-\s/.test(lines[i])) {
            arr.push(lines[i].replace(/^\s*-\s/, "").trim().replace(/^"|"$/g, ""));
            i++;
          }
          data[key] = arr;
          continue;
        }
        val = val.replace(/^"|"$/g, "");
        if (val === "true") val = true;
        else if (val === "false") val = false;
        data[key] = val;
      }
      i++;
    }
    return {
      title: data.title || "",
      date: data.date || "",
      image: data.image || "",
      imageAlt: data.imageAlt || "",
      category: data.category || "Impact",
      tags: data.tags || [],
      excerpt: data.excerpt || "",
      draft: data.draft === true,
      body: body.replace(/^\n+/, "").replace(/\n+$/, "\n"),
    };
  }

  function yamlEscape(str) {
    if (/[:#\n]|^\s|\s$/.test(str)) return `"${str.replace(/"/g, '\\"')}"`;
    return str;
  }

  function serializePost(data) {
    const tagsBlock = data.tags.length
      ? `tags:\n${data.tags.map((t) => `  - ${yamlEscape(t)}`).join("\n")}\n`
      : `tags: []\n`;
    return `---
title: ${yamlEscape(data.title)}
date: ${data.date}
image: ${data.image}
imageAlt: ${yamlEscape(data.imageAlt)}
category: ${data.category}
${tagsBlock}excerpt: ${yamlEscape(data.excerpt)}
draft: ${data.draft}
---
${data.body.trim()}
`;
  }

  function slugify(title) {
    return title.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function toDatetimeLocalValue(isoDateStr) {
    if (!isoDateStr) return "";
    const d = new Date(isoDateStr);
    if (isNaN(d)) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // ---------- Blog: open/edit ----------
  async function openPost(path) {
    document.getElementById("status-msg").textContent = "";
    document.getElementById("status-msg").className = "";
    document.getElementById("blog-list-view").style.display = "none";
    document.getElementById("blog-edit-view").style.display = "block";

    // build tag checkboxes
    const tagBox = document.getElementById("f-tags-options");
    tagBox.innerHTML = ALL_TAGS.map(
      (t) => `<label><input type="checkbox" value="${t}" class="tag-cb" /> ${t}</label>`
    ).join("");

    if (!path) {
      currentFile = null;
      document.getElementById("f-title").value = "";
      document.getElementById("f-date").value = toDatetimeLocalValue(new Date().toISOString());
      document.getElementById("f-image").value = "";
      document.getElementById("f-imagealt").value = "";
      document.getElementById("f-category").value = "Impact";
      document.getElementById("f-excerpt").value = "";
      document.getElementById("f-body").value = "";
      document.getElementById("f-draft").checked = true;
      document.getElementById("f-image-preview").style.display = "none";
      document.getElementById("delete-post-btn").style.display = "none";
      return;
    }

    document.getElementById("delete-post-btn").style.display = "inline-block";
    const res = await ghFetch(`contents/${path}?ref=${CONFIG.BRANCH}`);
    const fileData = await res.json();
    const raw = decodeURIComponent(escape(atob(fileData.content)));
    const post = parsePost(raw);
    currentFile = { path, sha: fileData.sha };

    document.getElementById("f-title").value = post.title;
    document.getElementById("f-date").value = toDatetimeLocalValue(post.date);
    document.getElementById("f-image").value = post.image;

    statusEl.className = "";
    try {

      const ext = file.name.split(".").pop();
      const filename = `${Date.now()}-${slugify(file.name.replace(/\.[^.]+$/, ""))}.${ext}`;
      const uploadPath = `${CONFIG.BLOG_IMAGE_PATH}/${filename}`;
      await ghFetch(`contents/${uploadPath}`, {
        method: "PUT",
        body: JSON.stringify({
          message: `Upload blog image: ${filename}`,

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- Blog: save ----------
  document.getElementById("save-post-btn").onclick = async () => {
    const statusEl = document.getElementById("status-msg");
    statusEl.textContent = "Saving…";
    statusEl.className = "";

    const title = document.getElementById("f-title").value.trim();
    if (!title) {
      statusEl.textContent = "Title is required.";
      statusEl.className = "error";
      return;
    }
    const dateVal = document.getElementById("f-date").value;
    const isoDate = dateVal ? new Date(dateVal).toISOString().replace(/\.\d{3}Z$/, ".000+07:00") : new Date().toISOString();
    const tags = Array.from(document.querySelectorAll(".tag-cb"))
      .filter((cb) => cb.checked)
      .map((cb) => cb.value);

    const postData = {
      title,
      date: isoDate,
      image: document.getElementById("f-image").value.trim(),
      imageAlt: document.getElementById("f-imagealt").value.trim(),
      category: document.getElementById("f-category").value,
      tags,
      excerpt: document.getElementById("f-excerpt").value.trim(),
      draft: document.getElementById("f-draft").checked,
      body: document.getElementById("f-body").value,
    };

    const raw = serializePost(postData);
    const base64Content = btoa(unescape(encodeURIComponent(raw)));

    let path = currentFile ? currentFile.path : null;
    if (!path) {
      const today = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const dateSlug = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
      path = `${CONFIG.BLOG_CONTENT_PATH}/${dateSlug}-${slugify(title)}.md`;
    }

    try {
      const body = {
        message: currentFile ? `Update blog post: ${title}` : `Create blog post: ${title}`,
        content: base64Content,
        branch: CONFIG.BRANCH,
      };
      if (currentFile) body.sha = currentFile.sha;

      const res = await ghFetch(`contents/${path}`, { method: "PUT", body: JSON.stringify(body) });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "Save failed");
      }
      const result = await res.json();
      currentFile = { path, sha: result.content.sha };
      document.getElementById("delete-post-btn").style.display = "inline-block";
      statusEl.textContent = "Saved. The site will rebuild shortly if auto-deploy is set up on Scicube.";
      statusEl.className = "success";
    } catch (err) {
      statusEl.textContent = "Error saving: " + err.message;
      statusEl.className = "error";
    }
  };

  async function loadTaxonomy() {
    try {
      const res = await ghFetch(`contents/${CONFIG.PRODUCT_TAXONOMY_PATH}?ref=${CONFIG.BRANCH}`);

  function renderTaxonomyEditor() {
    const container = document.getElementById("taxonomy-groups");
    container.innerHTML = "";
    TAXONOMY_GROUPS.forEach((group) => {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "1.2rem";
      const items = taxonomy[group.key] || [];
      wrap.innerHTML = `
        <label>${group.label}</label>
        <div class="tag-options" id="taxo-list-${group.key}">
          ${items.map((val, i) => `
            <span style="display:inline-flex;align-items:center;gap:0.3rem;background:var(--warm-beige);padding:0.3rem 0.6rem;border-radius:20px;font-size:0.8rem;">
              ${escapeHtml(val)}
              <button type="button" data-key="${group.key}" data-idx="${i}" class="taxo-remove-btn" style="border:none;background:none;color:var(--danger);cursor:pointer;font-weight:700;">×</button>
            </span>
          `).join("")}
        </div>
        <div style="display:flex;gap:0.4rem;margin-top:0.5rem;">
          <input type="text" placeholder="Add new ${group.label.toLowerCase()} option…" class="taxo-input" data-key="${group.key}" style="flex:1;" />
          <button type="button" class="btn secondary taxo-add-btn" data-key="${group.key}">Add</button>
        </div>
      `;
      container.appendChild(wrap);
    });

    document.querySelectorAll(".taxo-remove-btn").forEach((btn) => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        const idx = parseInt(btn.dataset.idx, 10);
        taxonomy[key].splice(idx, 1);
        renderTaxonomyEditor();
      };
    });
    document.querySelectorAll(".taxo-add-btn").forEach((btn) => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        const input = document.querySelector(`.taxo-input[data-key="${key}"]`);
        const val = input.value.trim();
        if (!val) return;
        if (!taxonomy[key]) taxonomy[key] = [];
        if (taxonomy[key].includes(val)) return;
        taxonomy[key].push(val);
        input.value = "";
        renderTaxonomyEditor();
      };
    });

      productsCache = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

      productsLoaded = true;

      if (!productsCache.length) {
        listEl.innerHTML = "<p class='empty-note'>No products yet — create one!</p>";

      listEl.innerHTML = "";

  function renderProductTaxonomyCheckboxes(selected) {
    selected = selected || { series: [], giftLevels: [], tags: [] };
    const map = {
      series: "p-series-options",
      giftLevels: "p-giftlevels-options",
      tags: "p-tags-options",
    };
    Object.keys(map).forEach((key) => {
      const el = document.getElementById(map[key]);
      const options = taxonomy[key] || [];
      if (!options.length) {
        el.innerHTML = `<span class="empty-note">No options yet — add some above in "Manage Series / Gift Levels / Tags options".</span>`;
        return;
      }
      el.innerHTML = options.map(
        (val) => `<label><input type="checkbox" value="${escapeHtml(val)}" class="p-cb-${key}" ${(selected[key] || []).includes(val) ? "checked" : ""} /> ${escapeHtml(val)}</label>`
      ).join("");
    });

  function openProduct(id) {
    document.getElementById("product-status-msg").textContent = "";
    document.getElementById("product-status-msg").className = "";
    document.getElementById("product-list-view").style.display = "none";
    document.getElementById("product-edit-view").style.display = "block";

    if (id === null) {
      currentProductId = null;
      document.getElementById("p-name").value = "";
      document.getElementById("p-desc").value = "";
      document.getElementById("p-img").value = "";

      document.getElementById("delete-product-btn").style.display = "none";
      renderProductTaxonomyCheckboxes();
      return;

    if (!product) return;
    currentProductId = id;
    document.getElementById("delete-product-btn").style.display = "inline-block";
    document.getElementById("p-name").value = product.name || "";
    document.getElementById("p-desc").value = product.desc || "";
    document.getElementById("p-img").value = product.img || "";
    document.getElementById("p-category").value = product.category || "mice";

      img.src = product.img;
      img.style.display = "block";
    } else {
      document.getElementById("p-img-preview").style.display = "none";

    renderProductTaxonomyCheckboxes({
      series: product.series || [],
      giftLevels: product.giftLevels || [],
      tags: product.tags || [],

  document.getElementById("save-product-btn").onclick = async () => {
    const statusEl = document.getElementById("product-status-msg");
    statusEl.textContent = "Saving…";
    statusEl.className = "";

    const name = document.getElementById("p-name").value.trim();
    if (!name) {
      statusEl.textContent = "Name is required.";
      statusEl.className = "error";
      return;
    }

    const getChecked = (cls) => Array.from(document.querySelectorAll(`.${cls}`)).filter((cb) => cb.checked).map((cb) => cb.value);

    const productData = {
      name,
      desc: document.getElementById("p-desc").value.trim(),
      img: document.getElementById("p-img").value.trim(),
      category: document.getElementById("p-category").value,
      series: getChecked("p-cb-series"),
      giftLevels: getChecked("p-cb-giftLevels"),
      tags: getChecked("p-cb-tags"),
    };

    if (currentProductId === null) {
      const nextId = productsCache.length ? Math.max(...productsCache.map((p) => p.id)) + 1 : 1;
      productData.id = nextId;
      productsCache.push(productData);
    } else {
      const idx = productsCache.findIndex((p) => p.id === currentProductId);
      productData.id = currentProductId;
      productsCache[idx] = productData;

  function renderRepeatableGroup(groupName) {
    const group = REPEATABLE_GROUPS[groupName];

    const items = contactData[group.key] || [];
    container.innerHTML = "";

    items.forEach((item, idx) => {
      const card = document.createElement("div");
      card.style.cssText = "border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:0.8rem;position:relative;";
      let fieldsHtml = "";
      group.fields.forEach((f) => {
        const val = escapeHtml(item[f.name] || "");
        if (f.type === "textarea") {
          fieldsHtml += `<label style="margin-top:0.6rem;">${f.label}</label><textarea data-field="${f.name}" style="min-height:60px;font-family:inherit;">${val}</textarea>`;
        } else {
          fieldsHtml += `<label style="margin-top:0.6rem;">${f.label}</label><input type="text" data-field="${f.name}" value="${val}" />`;
        }
      });
      card.innerHTML = fieldsHtml + `<button type="button" class="btn danger group-remove-btn" style="margin-top:0.8rem;padding:0.4rem 0.9rem;font-size:0.8rem;">Remove</button>`;
      card.querySelectorAll("[data-field]").forEach((input) => {
        input.addEventListener("input", () => {
          items[idx][input.dataset.field] = input.value;

      });
      card.querySelector(".group-remove-btn").onclick = () => {
        items.splice(idx, 1);
        renderRepeatableGroup(groupName);

    const statusEl = document.getElementById("contact-status-msg");
    statusEl.textContent = "Saving…";
    statusEl.className = "";

    contactData.hero.title = document.getElementById("c-hero-title").value.trim();
    contactData.hero.subtitle = document.getElementById("c-hero-subtitle").value.trim();

    contactData.contactInfo.email = document.getElementById("c-info-email").value.trim();
    contactData.contactInfo.emailNote = document.getElementById("c-info-emailNote").value.trim();
    contactData.contactInfo.responseTime = document.getElementById("c-info-responseTime").value.trim();
    contactData.contactInfo.responseTimeNote = document.getElementById("c-info-responseTimeNote").value.trim();
    contactData.contactInfo.location = document.getElementById("c-info-location").value.trim();
    contactData.contactInfo.locationNote = document.getElementById("c-info-locationNote").value.trim();

    contactData.finalCta.title = document.getElementById("c-cta-title").value.trim();
    contactData.finalCta.subtitle = document.getElementById("c-cta-subtitle").value.trim();

    try {
      const content = JSON.stringify(contactData, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(content)));
      const body = {
        message: "Update contact page content",
        content: base64Content,
        branch: CONFIG.BRANCH,
      };
      if (contactFile) body.sha = contactFile.sha;
      const res = await ghFetch(`contents/${CONFIG.CONTACT_PATH}`, { method: "PUT", body: JSON.stringify(body) });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "Save failed");
      }
      const result = await res.json();
      contactFile = { sha: result.content.sha };
      statusEl.textContent = "Saved.";
      statusEl.className = "success";
    } catch (err) {
      statusEl.textContent = "Error saving: " + err.message;
      statusEl.className = "error";
    }
  };

  // Load contact data the first time the Contact tab is opened
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    if (btn.dataset.tab === "contact") {
      btn.addEventListener("click", () => loadContact());
    }
  });

  boot();
})();
</script>
</body>
</html>
