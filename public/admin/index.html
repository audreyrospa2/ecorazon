<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Ecorazón CMS</title>
<style>
  :root {
    --forest-green: #2C5F2D;
    --deep-olive: #4A5D23;
    --cork-brown: #8B7355;
    --warm-beige: #F5F0E8;
    --border: #E0DAD0;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--warm-beige);
    color: #2b2b2b;
  }
  header {
    background: var(--forest-green);
    color: white;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header .meta { font-size: 0.8rem; opacity: 0.85; }
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 90vh;
    text-align: center;
  }
  #login-screen button, .btn {
    background: var(--forest-green);
    color: white;
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn.secondary { background: var(--cork-brown); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  nav.tabs {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem 0;
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    color: #555;
  }
  nav.tabs button.active {
    color: var(--forest-green);
    border-bottom-color: var(--forest-green);
    font-weight: 600;
  }
  main { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
  .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .title { font-weight: 600; }
  .list-row .sub { font-size: 0.8rem; color: #777; }
  .row-actions button { margin-left: 0.4rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 1rem 0 0.3rem; color: #444; }
  input[type=text], input[type=datetime-local], input[type=url], textarea, select {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  textarea { min-height: 220px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
  .checkbox-row input { width: auto; }
  .tag-options { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
  .tag-options label {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-weight: 400; font-size: 0.8rem;
    background: var(--warm-beige); padding: 0.3rem 0.6rem; border-radius: 20px;
    margin: 0; cursor: pointer;
  }
  .tag-options input { width: auto; }
  .form-actions { margin-top: 1.5rem; display: flex; gap: 0.6rem; }
  #status-msg { font-size: 0.85rem; margin-top: 0.8rem; }
  #status-msg.error { color: var(--danger); }
  #status-msg.success { color: var(--forest-green); }
  .top-actions { display: flex; justify-content: space-between; margin-bottom: 1rem; }
  .empty-note { color: #888; font-size: 0.85rem; }
  .image-preview { max-width: 200px; border-radius: 6px; margin-top: 0.4rem; display: block; }
  .avatar-preview { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .list-row-media { display: flex; align-items: center; gap: 0.8rem; }
  .order-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 0.5rem; background: var(--warm-beige);
  }
  .order-row select { flex: 1; }
  .order-row .order-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    width: 28px; height: 28px; cursor: pointer; font-size: 0.85rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .order-row .order-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .order-row .order-remove { color: var(--danger); font-weight: 700; }

  nav.tabs { flex-wrap: wrap; }
  .status-msg { font-size: 0.85rem; margin-top: 0.8rem; }
  .status-msg.error { color: var(--danger); }
  .status-msg.success { color: var(--forest-green); }
  input[type=color] { width: 64px; height: 36px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: white; }
</style>
</head>

  <p id="login-error" style="color:#b3261e;font-size:0.85rem;"></p>

<script>
(function () {
  const ALL_TAGS = ["Sustainability","Artists","Corporate Gifting","ESG","Upcycling","Seed Paper","Social Impact","Innovation"];
  let token = sessionStorage.getItem("ecorazon_gh_token") || null;
  let currentFile = null; // { path, sha } of post being edited

  // ---------- Auth ----------
  document.getElementById("login-btn").onclick = () => {
    const popup = window.open(`${CONFIG.WORKER_URL}/auth`, "gh-oauth", "width=600,height=700");
    window.addEventListener("message", function handler(e) {
      if (e.data && e.data.type === "ecorazon-cms-auth") {
        token = e.data.token;
        sessionStorage.setItem("ecorazon_gh_token", token);
        window.removeEventListener("message", handler);
        boot();
      }
    });
  };

  document.getElementById("logout-btn").onclick = (e) => {
    e.preventDefault();
    sessionStorage.removeItem("ecorazon_gh_token");
    location.reload();
  };

  document.getElementById("client-login-btn").onclick = async () => {
    const pwInput = document.getElementById("client-password-input");
    const errEl = document.getElementById("client-login-error");
    errEl.textContent = "";
    const password = pwInput.value;
    if (!password) return;
    try {
      const res = await fetch(`${CONFIG.WORKER_URL}/password-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || "Login failed.";
        return;
      }
      token = data.token;
      sessionStorage.setItem("ecorazon_gh_token", token);
      boot();
    } catch (err) {
      errEl.textContent = "Could not reach the login service.";
    }
  };

  document.getElementById("client-password-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("client-login-btn").click();
  });

  async function ghFetch(path, options = {}) {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/${path}`, {
      ...options,
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      sessionStorage.removeItem("ecorazon_gh_token");
      document.getElementById("login-error").textContent = "Session expired — please log in again.";
      document.getElementById("app").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
      throw new Error("Unauthorized");
    }
    return res;
  }

  async function boot() {
    if (!token) return;
    try {
      const meRes = await fetch("https://api.github.com/user", {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!meRes.ok) throw new Error("bad token");
      const me = await meRes.json();
      document.getElementById("user-label").textContent = me.login;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadBlogList();
    } catch (err) {
      sessionStorage.removeItem("ecorazon_gh_token");
      document.getElementById("login-error").textContent = "Login failed — please try again.";
    }
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach((p) => (p.style.display = "none"));
      document.getElementById(`tab-${btn.dataset.tab}`).style.display = "block";
    };
  });

  // ---------- Blog: list ----------
  async function loadBlogList() {
    const listEl = document.getElementById("blog-list");
    listEl.innerHTML = "<p class='empty-note'>Loading…</p>";
    try {
      const res = await ghFetch(`contents/${CONFIG.BLOG_CONTENT_PATH}?ref=${CONFIG.BRANCH}`);
      if (res.status === 404) {
        listEl.innerHTML = "<p class='empty-note'>No posts folder found yet.</p>";
        return;
      }
      const files = (await res.json()).filter((f) => f.name.endsWith(".md"));
      if (!files.length) {
        listEl.innerHTML = "<p class='empty-note'>No posts yet — create one!</p>";
        return;
      }

  // ---------- Blog: frontmatter parse/serialize (matches this project's exact schema) ----------
  function parsePost(raw) {
    const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!match) return { title: "", date: "", image: "", imageAlt: "", category: "Impact", tags: [], excerpt: "", draft: true, body: raw };
    const fmText = match[1];
    const body = match[2] || "";
    const data = { tags: [] };
    const lines = fmText.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const kv = line.match(/^(\w+):\s?(.*)$/);
      if (kv) {
        const key = kv[1];
        let val = kv[2].trim();
        if (val === "" && lines[i + 1] && /^\s*-\s/.test(lines[i + 1])) {
          const arr = [];
          i++;
          while (i < lines.length && /^\s*-\s/.test(lines[i])) {
            arr.push(lines[i].replace(/^\s*-\s/, "").trim().replace(/^"|"$/g, ""));
            i++;
          }
          data[key] = arr;
          continue;
        }
        val = val.replace(/^"|"$/g, "");
        if (val === "true") val = true;
        else if (val === "false") val = false;
        data[key] = val;
      }
      i++;
    }
    return {
      title: data.title || "",
      date: data.date || "",
      image: data.image || "",
      imageAlt: data.imageAlt || "",
      category: data.category || "Impact",
      tags: data.tags || [],
      excerpt: data.excerpt || "",
      draft: data.draft === true,
      body: body.replace(/^\n+/, "").replace(/\n+$/, "\n"),
    };
  }

  function yamlEscape(str) {
    if (/[:#\n]|^\s|\s$/.test(str)) return `"${str.replace(/"/g, '\\"')}"`;
    return str;
  }

  function serializePost(data) {
    const tagsBlock = data.tags.length
      ? `tags:\n${data.tags.map((t) => `  - ${yamlEscape(t)}`).join("\n")}\n`
      : `tags: []\n`;
    return `---
title: ${yamlEscape(data.title)}
date: ${data.date}
image: ${data.image}
imageAlt: ${yamlEscape(data.imageAlt)}
category: ${data.category}
${tagsBlock}excerpt: ${yamlEscape(data.excerpt)}
draft: ${data.draft}
---
${data.body.trim()}
`;
  }

  function slugify(title) {
    return title.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function toDatetimeLocalValue(isoDateStr) {
    if (!isoDateStr) return "";
    const d = new Date(isoDateStr);
    if (isNaN(d)) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

      document.getElementById("f-imagealt").value = "";

    document.getElementById("delete-post-btn").style.display = "inline-block";

    const post = parsePost(raw);
    currentFile = { path, sha: fileData.sha };

    document.getElementById("f-title").value = post.title;
    document.getElementById("f-date").value = toDatetimeLocalValue(post.date);
    document.getElementById("f-image").value = post.image;
    document.getElementById("f-imagealt").value = post.imageAlt;
    document.getElementById("f-category").value = post.category;

      cb.checked = post.tags.includes(cb.value);

  function teamSlugify(name) {
    return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function uniqueTeamId(base) {
    if (!base) base = "member";
    let id = base;
    let n = 2;
    const existingIds = teamData.members.map((m) => m.id);
    while (existingIds.includes(id)) {
      id = `${base}-${n}`;
      n++;
    }
    return id;
  }

    const statusEl = document.getElementById("team-status-msg");

  function renderTeamOrderColumn(colKey) {
    const listEl = document.getElementById(`team-order-${colKey}`);
    const ids = teamData[colKey] || [];
    if (!ids.length) {
      listEl.innerHTML = `<p class="empty-note">No members in this column yet — add one below.</p>`;
    } else {
      listEl.innerHTML = "";
      ids.forEach((id, i) => {
        const member = teamData.members.find((m) => m.id === id);
        const row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML = `
          <select data-idx="${i}" class="order-member-select"></select>
          <button type="button" class="order-btn order-up" ${i === 0 ? "disabled" : ""} title="Move up">↑</button>
          <button type="button" class="order-btn order-down" ${i === ids.length - 1 ? "disabled" : ""} title="Move down">↓</button>
          <button type="button" class="order-btn order-remove" title="Remove">×</button>
        `;
        const select = row.querySelector(".order-member-select");
        select.innerHTML = teamData.members.map((m) => `<option value="${escapeHtml(m.id)}" ${m.id === id ? "selected" : ""}>${escapeHtml(m.name || m.id)}</option>`).join("");
        select.onchange = () => { teamData[colKey][i] = select.value; };
        row.querySelector(".order-up").onclick = () => {
          if (i === 0) return;
          [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]];
          renderTeamOrderColumn(colKey);
        };
        row.querySelector(".order-down").onclick = () => {
          if (i === ids.length - 1) return;
          [ids[i + 1], ids[i]] = [ids[i], ids[i + 1]];
          renderTeamOrderColumn(colKey);
        };
        row.querySelector(".order-remove").onclick = () => {
          ids.splice(i, 1);
          renderTeamOrderColumn(colKey);
        };
        listEl.appendChild(row);
        if (!member) {
          // referenced id no longer exists among members — flag it visually
          row.style.borderColor = "var(--danger)";
        }
      });

    const addSelect = document.getElementById(`team-order-add-select-${colKey}`);

  const attr = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

  function getPath(obj, path) {
    return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, val) {
    const keys = path.split(".");
    let o = obj;
    keys.forEach((k, i) => {
      if (i === keys.length - 1) { o[k] = val; return; }
      if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
      o = o[k];
    });
  }
  function normOptions(opts) {
    return (typeof opts === "function" ? opts() : opts).map((o) => (typeof o === "string" ? { value: o, label: o } : o));
  }
  function blankFor(sub) {
    const blank = {};
    sub.forEach((sf) => {
      blank[sf.name] = sf.type === "select" ? normOptions(sf.options)[0].value : sf.type === "color" ? "#6b8f76" : "";
    });
    return blank;
  }
 
  // a list of small cards (e.g. course tags, project categories) that can be added / edited / removed
  function renderRepeater(container, items, sub) {
    container.innerHTML = "";
    items.forEach((item, idx) => {
      const card = document.createElement("div");
      card.style.cssText = "border:1px solid var(--border);border-radius:8px;padding:0.8rem;margin-bottom:0.6rem;";
      card.innerHTML =
        sub.map((sf) => {
          const v = item[sf.name] == null ? "" : item[sf.name];
          let input;
          if (sf.type === "select") {
            input = `<select data-sf="${sf.name}">${normOptions(sf.options).map((o) => `<option value="${attr(o.value)}" ${String(o.value) === String(v) ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`;
          } else if (sf.type === "color") {
            input = `<input type="color" data-sf="${sf.name}" value="${attr(v || "#6b8f76")}" style="width:64px;height:36px;padding:2px;" />`;
          } else if (sf.type === "textarea") {
            input = `<textarea data-sf="${sf.name}" style="min-height:60px;font-family:inherit;">${escapeHtml(v)}</textarea>`;
          } else {
            input = `<input type="text" data-sf="${sf.name}" value="${attr(v)}" />`;
          }
          return `<label style="margin-top:0.5rem;">${sf.label}</label>${input}`;
        }).join("") +
        `<button type="button" class="btn danger rp-remove" style="margin-top:0.7rem;padding:0.35rem 0.8rem;font-size:0.8rem;">Remove</button>`;
      card.querySelectorAll("[data-sf]").forEach((input) => {
        const handler = () => { items[idx][input.dataset.sf] = input.value; };
        input.addEventListener("input", handler);
        input.addEventListener("change", handler);
      });
      card.querySelector(".rp-remove").onclick = () => {
        items.splice(idx, 1);
        renderRepeater(container, items, sub);
      };
      container.appendChild(card);
    });

    const rep = {};           // repeater field name -> working array
 
    function setStatus(msg, cls, which) {
      const s = el(which || "status");
      if (!s) return;
      s.textContent = msg || "";
      s.className = "status-msg" + (cls ? " " + cls : "");
    }
 
    // ---------- build the markup ----------
    function fieldHtml(f) {
      const id = fid(f);
      const hint = f.hint ? `<div class="empty-note" style="margin-top:0.2rem;">${f.hint}</div>` : "";
      switch (f.type) {
        case "textarea":
        case "lines":
        case "paragraphs":
          return `<label>${f.label}</label><textarea id="${id}" style="min-height:${f.min || (f.type === "textarea" ? 80 : 110)}px;font-family:inherit;" placeholder="${attr(f.placeholder || "")}"></textarea>${hint}`;
        case "select":
          return `<label>${f.label}</label><select id="${id}"></select>${hint}`;
        case "checkboxes":
          return `<label>${f.label}</label><div class="tag-options" id="${id}"></div>${hint}`;
        case "boolean":
          return `<div class="checkbox-row"><input type="checkbox" id="${id}" /><label for="${id}" style="margin:0;">${f.label}</label></div>${hint}`;
        case "image":
          return `<label>${f.label}</label><input type="text" id="${id}" placeholder="/images/…" />
                  <label style="font-weight:400;">Or upload a new image</label>
                  <input type="file" id="${id}-file" accept="image/*" />
                  <img id="${id}-preview" class="image-preview" style="display:none;" />${hint}`;
        case "repeater":
          return `<label>${f.label}</label><div id="${id}"></div><button type="button" class="btn secondary" id="${id}-add" style="margin-top:0.3rem;">+ Add</button>${hint}`;
        default: // text, csv
          return `<label>${f.label}</label><input type="text" id="${id}" placeholder="${attr(f.placeholder || "")}" />${hint}`;
      }
    }
 
    const extraHtml = cfg.extra
      ? `<div class="panel" style="margin-top:1.5rem;">
           <div class="top-actions" style="cursor:pointer;margin-bottom:0;" id="${k}-x-toggle">
             <strong>${cfg.extra.title}</strong><span id="${k}-x-icon">▸</span>
           </div>
           <div id="${k}-x-body" style="display:none;margin-top:1rem;">
             ${cfg.extra.hint ? `<p class="empty-note" style="margin-top:0;">${cfg.extra.hint}</p>` : ""}
             <div id="${k}-x-list"></div>
             <button type="button" class="btn secondary" id="${k}-x-add" style="margin-top:0.3rem;">+ Add</button>
             <div class="form-actions"><button class="btn" id="${k}-x-save">Save</button></div>
             <div class="status-msg" id="${k}-x-status"></div>
           </div>
         </div>`
      : "";
 
    root.innerHTML = `
      <div id="${k}-list-view">
        <div class="top-actions">
          <button class="btn" id="${k}-save-order" style="display:none;">Save new order</button>
          <button class="btn" id="${k}-new">+ New ${cfg.singular}</button>
        </div>
        <div class="status-msg" id="${k}-list-status" style="margin:0 0 0.6rem;"></div>
        <div class="panel" id="${k}-list"></div>
        ${extraHtml}
      </div>
      <div id="${k}-edit-view" style="display:none;">
        <div class="panel">
          <button class="btn secondary" id="${k}-back" style="margin-bottom:1rem;">← Back to list</button>
          ${cfg.fields.map(fieldHtml).join("")}
          <div class="form-actions">
            <button class="btn" id="${k}-save">Save</button>
            <button class="btn danger" id="${k}-delete">Delete</button>
          </div>
          <div class="status-msg" id="${k}-status"></div>
        </div>
      </div>`;
 
    // ---------- value in / out of the form ----------
    function setValue(f, v) {
      const node = fe(f);
      switch (f.type) {
        case "csv": node.value = (v || []).join(", "); break;
        case "lines": node.value = (v || []).join("\n"); break;
        case "paragraphs": node.value = (v || []).join("\n\n"); break;
        case "boolean": node.checked = !!v; break;
        case "select": {
          const opts = normOptions(f.options);
          node.innerHTML = opts.map((o) => `<option value="${attr(o.value)}">${escapeHtml(o.label)}</option>`).join("");
          const want = v == null ? (opts[0] ? opts[0].value : "") : v;
          node.value = String(want);
          if (node.value !== String(want) && opts[0]) node.value = String(opts[0].value);
          break;
        }
        case "checkboxes": {
          const have = v || [];
          node.innerHTML = normOptions(f.options).map((o) =>
            `<label><input type="checkbox" value="${attr(o.value)}" ${have.includes(o.value) ? "checked" : ""} /> ${escapeHtml(o.label)}</label>`
          ).join("");
          break;
        }
        case "image": {
          node.value = v || "";
          const prev = document.getElementById(fid(f) + "-preview");
          if (v) { prev.src = v; prev.style.display = "block"; } else { prev.style.display = "none"; }
          const fileInput = document.getElementById(fid(f) + "-file");
          if (fileInput) fileInput.value = "";
          break;
        }
        case "repeater":
          rep[f.name] = clone(v || []);
          renderRepeater(node, rep[f.name], f.sub);
          break;
        default: node.value = v == null ? "" : v;
      }
    }
 
    function getValue(f) {
      const node = fe(f);
      switch (f.type) {
        case "csv": return node.value.split(",").map((s) => s.trim()).filter(Boolean);
        case "lines": return node.value.split("\n").map((s) => s.trim()).filter(Boolean);
        case "paragraphs": return node.value.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
        case "boolean": return node.checked;
        case "select": return f.number ? Number(node.value) : node.value;
        case "checkboxes": return Array.from(node.querySelectorAll("input:checked")).map((cb) => cb.value);
        case "repeater": {
          const first = f.sub[0].name;
          return (rep[f.name] || []).filter((it) => String(it[first] || "").trim());
        }
        default: return node.value.trim();
      }
    }
 
    // ---------- saving to GitHub ----------
    async function commit(message) {
      const content = JSON.stringify(data, null, 2) + "\n";
      const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: CONFIG.BRANCH };
      if (file) body.sha = file.sha;
      const res = await ghFetch(`contents/${cfg.path}`, { method: "PUT", body: JSON.stringify(body) });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "Save failed");
      }
      const result = await res.json();
      file = { sha: result.content.sha };
    }
 
    function uniqueId(base) {
      let id = base || k;
      let n = 2;
      const ids = data[cfg.itemsKey].map((i) => i.id);
      while (ids.includes(id)) { id = `${base || k}-${n}`; n++; }
      return id;
    }
 
    // ---------- list ----------
    function renderList() {
      const listEl = el("list");
      const items = data[cfg.itemsKey];
      el("save-order").style.display = orderDirty ? "inline-block" : "none";
      if (!items.length) {
        listEl.innerHTML = `<p class="empty-note">Nothing here yet — create one!</p>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach((item, i) => {
        const thumb = cfg.thumb ? cfg.thumb(item) : "";
        const row = document.createElement("div");
        row.className = "list-row";
        row.innerHTML = `
          <div class="list-row-media">
            ${thumb ? `<img class="avatar-preview" src="${attr(thumb)}" />` : ""}
            <div>
              <div class="title">${escapeHtml(cfg.title(item) || "(untitled)")}</div>
              <div class="sub">${escapeHtml(cfg.sub ? cfg.sub(item) : "")}</div>
            </div>
          </div>
          <div class="row-actions">
            <button class="btn secondary row-up" title="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
            <button class="btn secondary row-down" title="Move down" ${i === items.length - 1 ? "disabled" : ""}>↓</button>
            <button class="btn secondary row-edit">Edit</button>
          </div>`;
        row.querySelector(".row-edit").onclick = () => openItem(item.id);
        row.querySelector(".row-up").onclick = () => {
          [items[i - 1], items[i]] = [items[i], items[i - 1]];
          orderDirty = true; renderList();
        };
        row.querySelector(".row-down").onclick = () => {
          [items[i + 1], items[i]] = [items[i], items[i + 1]];
          orderDirty = true; renderList();
        };
        listEl.appendChild(row);
      });
    }
 
    async function load() {
      if (loaded) { renderList(); return; }
      el("list").innerHTML = "<p class='empty-note'>Loading…</p>";
      try {
        const res = await ghFetch(`contents/${cfg.path}?ref=${CONFIG.BRANCH}`);
        if (res.status === 404) {
          data = cfg.empty();
          file = null;
        } else {
          const fd = await res.json();
          data = JSON.parse(decodeURIComponent(escape(atob(fd.content))));
          file = { sha: fd.sha };
        }
        if (!Array.isArray(data[cfg.itemsKey])) data[cfg.itemsKey] = [];
        if (cfg.extra && !Array.isArray(data[cfg.extra.itemsKey])) data[cfg.extra.itemsKey] = cfg.empty()[cfg.extra.itemsKey];
        loaded = true;
        renderList();
        if (cfg.extra) renderRepeater(el("x-list"), data[cfg.extra.itemsKey], cfg.extra.sub);
      } catch (err) {
        if (err.message !== "Unauthorized") el("list").innerHTML = `<p class='empty-note'>Error loading: ${escapeHtml(err.message)}</p>`;
      }
    }
 
    // ---------- edit form ----------
    function openItem(id) {
      currentId = id;
      setStatus("");
      const item = id === null ? cfg.newItem() : clone(data[cfg.itemsKey].find((i) => i.id === id) || cfg.newItem());
      cfg.fields.forEach((f) => setValue(f, getPath(item, f.name)));
      el("delete").style.display = id === null ? "none" : "inline-block";
      el("list-view").style.display = "none";
      el("edit-view").style.display = "block";
    }
    function backToList() {
      el("edit-view").style.display = "none";
      el("list-view").style.display = "block";
      renderList();
    }
 
    el("new").onclick = () => openItem(null);
    el("back").onclick = backToList;
 
    cfg.fields.filter((f) => f.type === "image").forEach((f) => {
      const input = fe(f);
      const prev = document.getElementById(fid(f) + "-preview");
      input.addEventListener("input", () => {
        if (input.value) { prev.src = input.value; prev.style.display = "block"; } else { prev.style.display = "none"; }
      });
      document.getElementById(fid(f) + "-file").onchange = async (e) => {
        const fl = e.target.files[0];
        if (!fl) return;
        setStatus("Uploading image…");
        try {
          const b64 = await fileToBase64(fl);
          const ext = fl.name.split(".").pop();
          const filename = `${Date.now()}-${slugify(fl.name.replace(/\.[^.]+$/, ""))}.${ext}`;
          const res = await ghFetch(`contents/${cfg.imagePath}/${filename}`, {
            method: "PUT",
            body: JSON.stringify({ message: `Upload ${cfg.singular.toLowerCase()} image: ${filename}`, content: b64, branch: CONFIG.BRANCH }),
          });
          if (!res.ok) { const er = await res.json(); throw new Error(er.message || "Upload failed"); }
          input.value = `${cfg.imagePublicPrefix}/${filename}`;
          prev.src = URL.createObjectURL(fl);
          prev.style.display = "block";
          setStatus("Image uploaded — remember to press Save.", "success");
        } catch (err) {
          setStatus("Image upload failed: " + err.message, "error");
        }
      };
    });
 
    cfg.fields.filter((f) => f.type === "repeater").forEach((f) => {
      document.getElementById(fid(f) + "-add").onclick = () => {
        if (!rep[f.name]) rep[f.name] = [];
        rep[f.name].push(blankFor(f.sub));
        renderRepeater(fe(f), rep[f.name], f.sub);
      };
    });
 
    el("save").onclick = async () => {
      setStatus("Saving…");
      const items = data[cfg.itemsKey];
      const existing = currentId === null ? null : items.find((i) => i.id === currentId);
      const item = existing ? clone(existing) : {};
      cfg.fields.forEach((f) => setPath(item, f.name, getValue(f)));
 
      const req = cfg.fields.find((f) => f.required);
      if (req && !String(getPath(item, req.name) || "").trim()) {
        setStatus(`${req.label} is required.`, "error");
        return;
      }
      if (cfg.finalize) cfg.finalize(item);
 
      const backup = clone(data);
      if (existing) {
        items[items.indexOf(existing)] = item;
      } else {
        item.id = uniqueId(slugify(String(getPath(item, cfg.idFrom) || "")));
        items.push(item);
      }
      try {
        await commit(`${existing ? "Update" : "Add"} ${cfg.singular.toLowerCase()}: ${cfg.title(item)}`);
        currentId = item.id;
        el("delete").style.display = "inline-block";
        setStatus("Saved. The site updates after its next rebuild.", "success");
      } catch (err) {
        data = backup;
        setStatus("Error saving: " + err.message, "error");
      }
    };
 
    el("delete").onclick = async () => {
      if (currentId === null) return;
      if (!confirm(`Delete this ${cfg.singular.toLowerCase()} permanently? This cannot be undone.`)) return;
      const backup = clone(data);
      data[cfg.itemsKey] = data[cfg.itemsKey].filter((i) => i.id !== currentId);
      try {
        await commit(`Delete ${cfg.singular.toLowerCase()}: ${currentId}`);
        backToList();
      } catch (err) {
        data = backup;
        setStatus("Error deleting: " + err.message, "error");
      }
    };
 
    el("save-order").onclick = async () => {
      setStatus("Saving order…", "", "list-status");
      try {
        await commit(`Reorder ${cfg.plural.toLowerCase()}`);
        orderDirty = false;
        renderList();
        setStatus("Order saved.", "success", "list-status");
      } catch (err) {
        setStatus("Error saving order: " + err.message, "error", "list-status");
      }
    };
 
    // ---------- optional second list (project categories) ----------
    if (cfg.extra) {
      el("x-toggle").onclick = () => {
        const body = el("x-body");
        const showing = body.style.display !== "none";
        body.style.display = showing ? "none" : "block";
        el("x-icon").textContent = showing ? "▸" : "▾";
      };
      el("x-add").onclick = () => {
        data[cfg.extra.itemsKey].push(Object.assign(blankFor(cfg.extra.sub), { id: "" }));
        renderRepeater(el("x-list"), data[cfg.extra.itemsKey], cfg.extra.sub);
      };
      el("x-save").onclick = async () => {
        const backup = clone(data);
        const first = cfg.extra.sub[0].name;
        const keep = data[cfg.extra.itemsKey].filter((it) => String(it[first] || "").trim());
        const seen = new Set();
        keep.forEach((it) => {
          const base = it.id || slugify(it[first]) || "item";
          let id = base, n = 2;
          while (seen.has(id)) { id = `${base}-${n}`; n++; }
          it.id = id;
          seen.add(id);
        });
        const orphans = data[cfg.itemsKey].filter((p) => !seen.has(p[cfg.extra.refField]));
        if (orphans.length) {
          setStatus(`"${cfg.title(orphans[0])}" still uses a category you removed. Edit or delete it first.`, "error", "x-status");
          return;
        }
        data[cfg.extra.itemsKey] = keep;
        setStatus("Saving…", "", "x-status");
        try {
          await commit(`Update ${cfg.extra.singular}`);
          renderRepeater(el("x-list"), data[cfg.extra.itemsKey], cfg.extra.sub);
          setStatus("Saved.", "success", "x-status");
        } catch (err) {
          data = backup;
          renderRepeater(el("x-list"), data[cfg.extra.itemsKey], cfg.extra.sub);
          setStatus("Error saving: " + err.message, "error", "x-status");
        }
      };
    }
 
    // load the first time its tab is opened
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      if (btn.dataset.tab === k) btn.addEventListener("click", () => load());
    });
 
    return { load, openItem, data: () => data };
  }
 
  // ---------------- COURSES ----------------
  createCollection({
    key: "courses", singular: "Course", plural: "Courses",
    path: CONFIG.COURSES_PATH, itemsKey: "courses", idFrom: "title",
    imagePath: CONFIG.COURSE_IMAGE_PATH, imagePublicPrefix: CONFIG.COURSE_PUBLIC_IMAGE_PREFIX,
    empty: () => ({ courses: [] }),
    newItem: () => ({
      title: "", format: ["Online"], featured: false, color: "green", image: "", tags: [],
      theory: "", practice: "", instructor: "",
      details: { lead: "", duration: "", nextIntake: "", outcomes: [], registerUrl: "/get-in-touch" },
    }),
    title: (c) => c.title,
    sub: (c) => [(c.format || []).join(" & "), c.instructor].filter(Boolean).join(" · "),
    thumb: (c) => c.image,
    fields: [
      { name: "title", label: "Course title", type: "text", required: true },
      { name: "format", label: "Format", type: "checkboxes", options: ["Online", "In person"] },
      { name: "featured", label: 'Show the dark "Featured" badge', type: "boolean" },
      { name: "image", label: "Card image (optional)", type: "image", hint: "If you leave this empty, the card uses the colour below." },
      { name: "color", label: "Card colour (used when there is no image)", type: "select",
        options: [{ value: "green", label: "Green" }, { value: "pink", label: "Pink" }, { value: "brown", label: "Brown" }, { value: "sage", label: "Light green" }] },
      { name: "tags", label: "Tags", type: "repeater", sub: [
        { name: "label", label: "Tag text (e.g. #Facilitation)", type: "text" },
        { name: "color", label: "Colour", type: "select", options: [{ value: "green", label: "Green" }, { value: "pink", label: "Pink" }, { value: "blue", label: "Blue" }, { value: "brown", label: "Brown" }] },
      ] },
      { name: "theory", label: "Theory hours (e.g. 12 hrs)", type: "text" },
      { name: "practice", label: "Practice hours (e.g. 8 hrs)", type: "text" },
      { name: "instructor", label: "Instructor", type: "text" },
      { name: "details.lead", label: "Details popup — short overview", type: "textarea" },
      { name: "details.duration", label: "Details popup — duration (e.g. 6 weeks)", type: "text" },
      { name: "details.nextIntake", label: "Details popup — next intake (e.g. 12 March 2027)", type: "text" },
      { name: "details.outcomes", label: "Details popup — what you'll learn", type: "lines", hint: "One item per line." },
      { name: "details.registerUrl", label: "Details popup — register link", type: "text", placeholder: "/get-in-touch" },
    ],
  });
 
  // ---------------- PARTNERS ----------------
  createCollection({
    key: "partners", singular: "Partner", plural: "Partners",
    path: CONFIG.PARTNERS_PATH, itemsKey: "partners", idFrom: "name",
    imagePath: CONFIG.PARTNER_IMAGE_PATH, imagePublicPrefix: CONFIG.PARTNER_PUBLIC_IMAGE_PREFIX,
    empty: () => ({ partners: [] }),
    newItem: () => ({ name: "", desc: "", filterValue: "Partnerships", gradient: "green", image: "", row: 1 }),
    title: (p) => p.name,
    sub: (p) => `Row ${p.row === 2 ? 2 : 1}${p.desc ? " · " + p.desc : ""}`,
    thumb: (p) => p.image,
    fields: [
      { name: "name", label: "Partner type / name", type: "text", required: true },
      { name: "desc", label: "Short description", type: "textarea", min: 60 },
      { name: "row", label: "Which scrolling row?", type: "select", number: true,
        options: [{ value: 1, label: "Row 1 (scrolls left)" }, { value: 2, label: "Row 2 (scrolls right)" }] },
      { name: "image", label: "Logo / picture (optional)", type: "image", hint: "If empty, the round badge uses the colour below." },
      { name: "gradient", label: "Badge colour (used when there is no picture)", type: "select",
        options: [{ value: "blue", label: "Blue" }, { value: "green", label: "Green" }, { value: "orange", label: "Orange" }, { value: "purple", label: "Purple" }, { value: "slate", label: "Slate" }, { value: "gold", label: "Gold" }] },
      { name: "filterValue", label: '"Explore →" opens Journal articles in this category', type: "select",
        options: ["Artist Stories", "Materials", "Impact", "Partnerships", "Tips", "Innovation", "Community"] },
    ],
  });
 
  // ---------------- PROJECTS ----------------
  const projects = createCollection({
    key: "projects", singular: "Project", plural: "Projects",
    path: CONFIG.PROJECTS_PATH, itemsKey: "projects", idFrom: "title",
    imagePath: CONFIG.PROJECT_IMAGE_PATH, imagePublicPrefix: CONFIG.PROJECT_PUBLIC_IMAGE_PREFIX,
    empty: () => ({
      categories: [
        { id: "culture", label: "Corporate Culture & Wellbeing", short: "Culture", blurb: "Where work feels human", color: "#a07850" },
        { id: "arts", label: "Inclusive Arts & Community", short: "Arts", blurb: "Art that makes room", color: "#7f9c78" },
        { id: "brand", label: "Sustainable Brand Experiences", short: "Brands", blurb: "Less waste, more meaning", color: "#C08EA4" },
        { id: "ai", label: "Human-Centred AI Pilots", short: "AI Pilots", blurb: "Technology, kept accountable", color: "#6b8f76" },
      ],
      projects: [],
    }),
    newItem: () => ({ cat: "", title: "", summary: "", tags: [], meta: { Year: "", Partner: "", Format: "" }, body: [], highlights: [], images: ["", "", ""] }),
    title: (p) => p.title,
    sub: (p) => {
      const c = ((projects && projects.data().categories) || []).find((x) => x.id === p.cat);
      return (c ? c.label : p.cat) + ((p.tags || []).length ? " · " + p.tags.map((t) => "#" + t).join(" ") : "");
    },
    thumb: (p) => (p.images || [])[0],
    finalize: (p) => {
      // drop empty meta values and trailing empty image slots
      Object.keys(p.meta || {}).forEach((key) => { if (!String(p.meta[key] || "").trim()) delete p.meta[key]; });
      p.images = (p.images || []).map((s) => s || "");
      while (p.images.length && !p.images[p.images.length - 1]) p.images.pop();
    },
    extra: {
      title: "Manage project categories (the folder tabs)",
      hint: "These are the tabs in the Project Showroom. Renaming one keeps its projects. You can't remove a category that still has projects.",
      itemsKey: "categories", refField: "cat", singular: "project categories",
      sub: [
        { name: "label", label: "Full name (left-hand sorting tab)", type: "text" },
        { name: "short", label: "Short name (folder tab)", type: "text" },
        { name: "blurb", label: "One-line tagline", type: "text" },
        { name: "color", label: "Colour", type: "color" },
      ],
    },
    fields: [
      { name: "title", label: "Project title", type: "text", required: true },
      { name: "cat", label: "Category (which folder tab)", type: "select", options: () => ((projects && projects.data().categories) || []).map((c) => ({ value: c.id, label: c.label })) },
      { name: "summary", label: "Short summary (shown at the top, stays fixed)", type: "textarea", min: 60 },
      { name: "tags", label: "Keyword tags (optional)", type: "csv", placeholder: "Wellbeing, Pilot", hint: "Separate with commas. Visitors can click a tag to see projects that share it." },
      { name: "meta.Year", label: "Year", type: "text" },
      { name: "meta.Partner", label: "Partner / client", type: "text" },
      { name: "meta.Format", label: "Format (e.g. Pilot, Workshop)", type: "text" },
      { name: "body", label: "Overview (scrolling part)", type: "paragraphs", hint: "Leave a blank line between paragraphs." },
      { name: "highlights", label: "Highlights", type: "lines", hint: "One item per line." },
      { name: "images.0", label: "Main image", type: "image" },
      { name: "images.1", label: "Gallery image 1", type: "image" },
      { name: "images.2", label: "Gallery image 2", type: "image" },
    ],
  });

  boot();
})();
</script>
</body>
</html>
