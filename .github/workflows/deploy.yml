name: Build and Deploy to Scicube

# Runs every time something is pushed to main — including commits made
# by the CMS (blog posts, edits, deletes all go through this same path).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Astro's default build output is `dist/`. If your project builds
      # to a different folder, change `local-dir` below to match.
      - name: Deploy over FTP to Scicube
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Skips re-uploading files that haven't changed since the last
          # deploy, so most pushes are fast.
          dangerous-clean-slate: false